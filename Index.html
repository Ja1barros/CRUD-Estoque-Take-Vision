<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Take Vision Imagem</title>
<script>
window.onerror = function(msg, url, line, col, error) {
  var div = document.createElement('div');
  div.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#a32d2d;color:#fff;padding:16px;z-index:99999;font-family:monospace;font-size:13px;white-space:pre-wrap;max-height:80vh;overflow:auto;';
  div.textContent = 'ERRO DE JAVASCRIPT:\n' + msg + '\nLinha: ' + line + ', Coluna: ' + col;
  document.body.appendChild(div);
  return false;
};
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f0;color:#1a1a1a;min-height:100vh}
.auth{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1rem}
.auth-card{background:#fff;border-radius:16px;border:0.5px solid #e0e0d8;padding:2rem;width:100%;max-width:400px}
.auth-title{font-size:22px;font-weight:500;margin-bottom:6px}
.auth-sub{font-size:14px;color:#666;margin-bottom:24px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:#666;margin-bottom:4px}
input{width:100%;border:0.5px solid #d0d0c8;border-radius:8px;padding:8px 12px;font-size:14px}
.btn{width:100%;border:0.5px solid #d0d0c8;border-radius:8px;padding:9px 18px;font-size:14px;background:#1a1a1a;color:#fff;cursor:pointer;font-weight:500}
.err{background:#fcebeb;color:#a32d2d;border:0.5px solid #f09595;border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:12px}
.ok{background:#eaf3de;color:#3b6d11;border:0.5px solid #97c459;border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:12px}
.app{display:none;padding:2rem;text-align:center}
</style>
</head>
<body>
<div class="auth" id="authScreen">
  <div class="auth-card">
    <div class="auth-title">Take Vision Imagem</div>
    <div class="auth-sub" id="authSub">Entre com sua conta</div>
    <div id="authMsg"></div>
    <div class="field" id="nomeField" style="display:none"><label>Nome</label><input type="text" id="nomeInput" placeholder="Seu nome"/></div>
    <div class="field"><label>E-mail</label><input type="email" id="emailInput" placeholder="seu@email.com"/></div>
    <div class="field"><label>Senha</label><input type="password" id="senhaInput" placeholder="••••••••"/></div>
    <button class="btn" id="authBtn">Entrar</button>
    <div style="text-align:center;margin-top:14px"><button id="toggleBtn" style="background:none;border:none;color:#888;font-size:13px;cursor:pointer">Não tem conta? Cadastre-se</button></div>
  </div>
</div>
<div class="app" id="appScreen">
  <h2>Login funcionou! (versão de teste mínima)</h2>
  <p style="margin-top:10px;color:#666">Se você está vendo isso, o problema estava no arquivo grande anterior. Me avise que eu reconstruo o app completo por cima desta base limpa.</p>
</div>

<script>
try{
  var SUPA_URL="https://wikmeymvknuujbnwmfjx.supabase.co";
  var SUPA_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indpa21leW12a251dWpibndtZmp4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyNzI5MDEsImV4cCI6MjA5MTg0ODkwMX0.GaOJArnrhjsJ2gCs0dLNGvaLuIuekINW1VNfmdPdIgU";

  if(typeof supabase === "undefined"){
    throw new Error("Biblioteca do Supabase não carregou. Verifique sua internet.");
  }
  var sb = supabase.createClient(SUPA_URL, SUPA_KEY, {auth:{persistSession:true,autoRefreshToken:true,storageKey:"takevision_auth"}});

  var modoLogin = true;

  function toggleAuthMode(){
    modoLogin = !modoLogin;
    document.getElementById("authSub").textContent = modoLogin ? "Entre com sua conta" : "Crie sua conta";
    document.getElementById("toggleBtn").textContent = modoLogin ? "Não tem conta? Cadastre-se" : "Já tem conta? Entrar";
    document.getElementById("nomeField").style.display = modoLogin ? "none" : "block";
    document.getElementById("authBtn").textContent = modoLogin ? "Entrar" : "Cadastrar";
  }

  async function handleAuth(){
    var email = document.getElementById("emailInput").value.trim();
    var senha = document.getElementById("senhaInput").value;
    var msg = document.getElementById("authMsg");
    var btn = document.getElementById("authBtn");
    msg.innerHTML = "";
    if(!email || !senha){ msg.innerHTML = '<div class="err">Preencha e-mail e senha.</div>'; return; }
    btn.disabled = true; btn.textContent = "Aguarde...";
    try{
      if(modoLogin){
        var r = await sb.auth.signInWithPassword({email:email, password:senha});
        if(r.error){
          msg.innerHTML = '<div class="err">' + (r.error.message === "Invalid login credentials" ? "E-mail ou senha incorretos." : "Erro: " + r.error.message) + '</div>';
        } else if(r.data && r.data.session){
          document.getElementById("authScreen").style.display = "none";
          document.getElementById("appScreen").style.display = "block";
        } else {
          msg.innerHTML = '<div class="err">Login falhou.</div>';
        }
      } else {
        var nome = document.getElementById("nomeInput").value.trim();
        if(!nome){ msg.innerHTML = '<div class="err">Informe seu nome.</div>'; return; }
        var r2 = await sb.auth.signUp({email:email, password:senha});
        if(r2.error){ msg.innerHTML = '<div class="err">' + r2.error.message + '</div>'; return; }
        if(r2.data && r2.data.user){
          await sb.from("perfis").update({nome:nome}).eq("id", r2.data.user.id);
          msg.innerHTML = '<div class="ok">Conta criada! Faça login.</div>';
          modoLogin = true;
          toggleAuthMode();
        }
      }
    } catch(e){
      msg.innerHTML = '<div class="err">Erro: ' + e.message + '</div>';
    } finally {
      btn.disabled = false;
      btn.textContent = modoLogin ? "Entrar" : "Cadastrar";
    }
  }

  document.getElementById("authBtn").addEventListener("click", handleAuth);
  document.getElementById("toggleBtn").addEventListener("click", toggleAuthMode);

  window.addEventListener("load", async function(){
    var r = await sb.auth.getSession();
    if(r.data && r.data.session && r.data.session.user){
      document.getElementById("authScreen").style.display = "none";
      document.getElementById("appScreen").style.display = "block";
    }
  });

}catch(_topErr){
  var _d = document.createElement('div');
  _d.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#a32d2d;color:#fff;padding:16px;z-index:99999;font-family:monospace;font-size:13px;white-space:pre-wrap;';
  _d.textContent = 'ERRO NA INICIALIZAÇÃO:\n' + _topErr.message;
  document.body.appendChild(_d);
}
</script>
</body>
</html>
