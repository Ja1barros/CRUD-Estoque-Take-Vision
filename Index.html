<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Take Vision Imagem</title>
<script>
window.onerror = function(msg, url, line, col, error) {
  var div = document.createElement('div');
  div.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#a32d2d;color:#fff;padding:16px;z-index:99999;font-family:monospace;font-size:13px;white-space:pre-wrap;max-height:80vh;overflow:auto;';
  div.textContent = 'ERRO DE JAVASCRIPT:\n' + msg + '\nLinha: ' + line + ', Coluna: ' + col;
  document.body.appendChild(div);
  return false;
};
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f0;color:#1a1a1a;min-height:100vh}
.auth{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1rem}
.auth-card{background:#fff;border-radius:16px;border:0.5px solid #e0e0d8;padding:2rem;width:100%;max-width:400px}
.auth-title{font-size:22px;font-weight:500;margin-bottom:6px}
.auth-sub{font-size:14px;color:#666;margin-bottom:24px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:#666;margin-bottom:4px}
input{width:100%;border:0.5px solid #d0d0c8;border-radius:8px;padding:8px 12px;font-size:14px}
.btn{width:100%;border:0.5px solid #d0d0c8;border-radius:8px;padding:9px 18px;font-size:14px;background:#1a1a1a;color:#fff;cursor:pointer;font-weight:500}
.err{background:#fcebeb;color:#a32d2d;border:0.5px solid #f09595;border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:12px}
.ok{background:#eaf3de;color:#3b6d11;border:0.5px solid #97c459;border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:12px}
.app{display:none;min-height:100vh}
header{background:#fff;border-bottom:0.5px solid #e0e0d8;padding:0 1.5rem;display:flex;align-items:center;justify-content:space-between;height:56px}
.header-title{font-size:16px;font-weight:500}
.header-user{font-size:13px;color:#666;display:flex;align-items:center;gap:12px}
.tabs{display:flex;border-bottom:0.5px solid #e0e0d8;background:#fff;padding:0 1.5rem;overflow-x:auto}
.tab{padding:12px 18px;font-size:14px;border:none;background:none;cursor:pointer;color:#888;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.active{color:#1a1a1a;border-bottom-color:#1a1a1a;font-weight:500}
.content{padding:1.5rem;max-width:1100px;margin:0 auto}
.btn-outline{background:transparent;color:#1a1a1a}
.btn-sm{width:auto;padding:5px 14px;font-size:13px}
.btn-danger{background:#e24b4a;border-color:#e24b4a;color:#fff}
.btn-edit{background:#f5a623;border-color:#f5a623;color:#fff}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:1.5rem}
.metric{background:#fff;border:0.5px solid #e0e0d8;border-radius:10px;padding:1rem}
.metric-label{font-size:12px;color:#888;margin-bottom:4px}
.metric-value{font-size:22px;font-weight:500}
.card{background:#fff;border:0.5px solid #e0e0d8;border-radius:12px;padding:1rem 1.25rem;margin-bottom:10px}
.card-dashed{border-style:dashed;margin-top:16px}
.row{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.col{flex:1;min-width:140px}
.badge{font-size:11px;padding:3px 9px;border-radius:6px;font-weight:500}
.badge-ok{background:#eaf3de;color:#3b6d11}
.badge-warn{background:#faeeda;color:#854f0b}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.filter-btn{border:0.5px solid #d0d0c8;border-radius:8px;padding:5px 12px;font-size:12px;background:transparent;cursor:pointer}
.filter-btn.active{background:#f1efe8}
.section-title{font-size:16px;font-weight:500;margin-bottom:14px}
.section-sub{font-size:13px;font-weight:600;color:#444;margin:20px 0 10px;padding-bottom:6px;border-bottom:0.5px solid #e0e0d8;text-transform:uppercase}
.empty{color:#888;font-size:14px;padding:2rem 0;text-align:center}
.tag-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tag-item{display:flex;align-items:center;gap:6px;background:#f1efe8;border-radius:8px;padding:5px 10px;font-size:13px}
.tag-x{background:none;border:none;color:#a32d2d;cursor:pointer;font-size:15px}
.item-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.item-name{font-weight:500;font-size:15px}
.item-sub{font-size:12px;color:#888;margin-top:2px}
.actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.progress-wrap{background:#f1efe8;border-radius:4px;height:6px;overflow:hidden;margin-top:10px}
.progress-bar{height:100%;border-radius:4px}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;align-items:center;justify-content:center}
.modal-box{background:#fff;border-radius:16px;padding:1.5rem;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;margin:1rem}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
.modal-title{font-size:17px;font-weight:500}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:#888}
</style>
</head>
<body>
<div class="auth" id="authScreen">
  <div class="auth-card">
    <div class="auth-title">Take Vision Imagem</div>
    <div class="auth-sub" id="authSub">Entre com sua conta</div>
    <div id="authMsg"></div>
    <div class="field" id="nomeField" style="display:none"><label>Nome</label><input type="text" id="nomeInput" placeholder="Seu nome"/></div>
    <div class="field"><label>E-mail</label><input type="email" id="emailInput" placeholder="seu@email.com"/></div>
    <div class="field"><label>Senha</label><input type="password" id="senhaInput" placeholder="••••••••"/></div>
    <button class="btn" id="authBtn">Entrar</button>
    <div style="text-align:center;margin-top:14px"><button id="toggleBtn" style="background:none;border:none;color:#888;font-size:13px;cursor:pointer">Não tem conta? Cadastre-se</button></div>
  </div>
</div>
<div class="app" id="appScreen">
  <header>
    <div class="header-title">Take Vision Imagem</div>
    <div class="header-user"><span id="userNome"></span><button class="btn btn-outline btn-sm" id="btnSair" style="width:auto">Sair</button></div>
  </header>
  <div class="tabs">
    <button class="tab active" data-tab="estoque">Estoque</button>
    <button class="tab" data-tab="projetos">Projetos</button>
    <button class="tab" data-tab="freelancers">Freelancers</button>
    <button class="tab" data-tab="movimentar">Movimentar</button>
    <button class="tab" data-tab="historico">Histórico</button>
    <button class="tab" data-tab="calendario">Calendário</button>
    <button class="tab" data-tab="orcamentos">Orçamentos</button>
    <button class="tab" data-tab="financas">Finanças</button>
    <button class="tab" data-tab="usuarios">Usuários</button>
  </div>
  <div class="content">
    <div id="appMsg"></div>
    <div id="tab-estoque">
      <div class="metrics" id="metricsArea"></div>
      <div style="display:flex;gap:8px;margin-bottom:10px">
        <input id="buscaEq" placeholder="🔍 Buscar equipamento..." style="flex:1;max-width:340px"/>
      </div>
      <div class="filters" id="filtrosArea"></div>
      <div id="listaEquipamentos"></div>
      <div class="section-sub">Gerenciar equipamentos</div>
      <div id="gerenciarEquipamentos"></div>
      <div class="card card-dashed">
        <div class="section-title">Adicionar equipamento</div>
        <div class="row">
          <div class="col"><label style="font-size:13px;color:#666">Nome</label><input id="eqNome" placeholder="Ex: Canon R5"/></div>
          <div class="col"><label style="font-size:13px;color:#666">Categoria</label><select id="eqCat"></select></div>
          <div style="width:90px"><label style="font-size:13px;color:#666">Qtd</label><input id="eqQtd" type="number" min="1" value="1"/></div>
        </div>
        <div class="row">
          <div class="col"><label style="font-size:13px;color:#666">Nº de série</label><input id="eqSerie" placeholder="Opcional"/></div>
          <div style="display:flex;align-items:flex-end"><button class="btn btn-sm btn-outline" id="btnCadastrarEq" style="width:auto">+ Adicionar</button></div>
        </div>
      </div>
      <div class="section-sub">Gerenciar categorias</div>
      <div class="tag-list" id="listaCategorias"></div>
      <div class="card card-dashed">
        <div class="section-title">Adicionar categoria</div>
        <div class="row">
          <div class="col"><input id="catNome" placeholder="Ex: Drones"/></div>
          <div style="display:flex;align-items:center"><button class="btn btn-sm btn-outline" id="btnCriarCategoria" style="width:auto">+ Adicionar</button></div>
        </div>
      </div>
    </div>

    <div id="tab-projetos" style="display:none">
      <div class="section-sub">Projetos</div>
      <div id="listaProjetos"></div>
      <div class="card card-dashed">
        <div class="section-title">Criar projeto</div>
        <div class="row">
          <div class="col"><label style="font-size:13px;color:#666">Nome</label><input id="projNome" placeholder="Ex: Clip Musical"/></div>
          <div class="col"><label style="font-size:13px;color:#666">Cliente</label><input id="projCliente" placeholder="Ex: Empresa XYZ"/></div>
        </div>
        <div class="row">
          <div class="col"><label style="font-size:13px;color:#666">Data</label><input id="projData" type="date"/></div>
        </div>
        <button class="btn btn-sm btn-outline" id="btnCriarProjeto" style="width:auto">+ Criar projeto</button>
      </div>
    </div>

    <div id="tab-freelancers" style="display:none">
      <div class="section-sub">Freelancers cadastrados</div>
      <div id="listaFreelancers"></div>
      <div class="card card-dashed">
        <div class="section-title">Cadastrar freelancer</div>
        <div class="row">
          <div class="col"><label style="font-size:13px;color:#666">Nome</label><input id="flNome" placeholder="Ex: João Silva"/></div>
          <div class="col"><label style="font-size:13px;color:#666">Telefone</label><input id="flTel" placeholder="(21) 99999-9999"/></div>
          <div class="col"><label style="font-size:13px;color:#666">Função</label><input id="flFuncao" placeholder="Ex: Cinegrafista"/></div>
        </div>
        <button class="btn btn-sm btn-outline" id="btnCadastrarFl" style="width:auto">+ Cadastrar</button>
      </div>
    </div><div class="modal-box"><div class="modal-header"><div class="modal-title">Editar equipamento</div><button class="modal-close" data-close="modalEq">×</button></div><div class="field"><label>Nome</label><input id="editEqNome"/></div><div class="field"><label>Categoria</label><select id="editEqCat"></select></div><div class="field"><label>Qtd total</label><input id="editEqQtd" type="number" min="1"/></div><div class="field"><label>Nº de série</label><input id="editEqSerie"/></div><div style="display:flex;gap:8px"><button class="btn btn-sm btn-outline" id="btnSalvarEq" style="width:auto">Salvar</button><button class="btn btn-sm btn-outline" data-close="modalEq" style="width:auto">Cancelar</button></div></div></div>
<div class="modal-bg" id="modalCat"><div class="modal-box"><div class="modal-header"><div class="modal-title">Editar categoria</div><button class="modal-close" data-close="modalCat">×</button></div><div class="field"><label>Nome</label><input id="editCatNome"/></div><div style="display:flex;gap:8px"><button class="btn btn-sm btn-outline" id="btnSalvarCategoria" style="width:auto">Salvar</button><button class="btn btn-sm btn-outline" data-close="modalCat" style="width:auto">Cancelar</button></div></div></div>
<div class="modal-bg" id="modalConfirm"><div class="modal-box" style="max-width:380px">
  <p id="modalConfirmMsg" style="font-size:14px;margin-bottom:20px;color:#555;text-align:center;line-height:1.6"></p>
  <div style="display:flex;gap:8px;justify-content:center">
    <button class="btn btn-sm btn-danger" id="modalConfirmOk" style="width:auto;min-width:110px">Sim, excluir</button>
    <button class="btn btn-sm btn-outline" data-close="modalConfirm" style="width:auto;min-width:90px">Cancelar</button>
  </div>
</div></div>

<script>
try{
  var SUPA_URL="https://wikmeymvknuujbnwmfjx.supabase.co";
  var SUPA_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indpa21leW12a251dWpibndtZmp4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyNzI5MDEsImV4cCI6MjA5MTg0ODkwMX0.GaOJArnrhjsJ2gCs0dLNGvaLuIuekINW1VNfmdPdIgU";

  if(typeof supabase === "undefined"){
    throw new Error("Biblioteca do Supabase não carregou. Verifique sua internet.");
  }
  var sb = supabase.createClient(SUPA_URL, SUPA_KEY, {auth:{persistSession:true,autoRefreshToken:true,storageKey:"takevision_auth"}});

  var modoLogin = true;

  function toggleAuthMode(){
    modoLogin = !modoLogin;
    document.getElementById("authSub").textContent = modoLogin ? "Entre com sua conta" : "Crie sua conta";
    document.getElementById("toggleBtn").textContent = modoLogin ? "Não tem conta? Cadastre-se" : "Já tem conta? Entrar";
    document.getElementById("nomeField").style.display = modoLogin ? "none" : "block";
    document.getElementById("authBtn").textContent = modoLogin ? "Entrar" : "Cadastrar";
  }

  async function handleAuth(){
    var email = document.getElementById("emailInput").value.trim();
    var senha = document.getElementById("senhaInput").value;
    var msg = document.getElementById("authMsg");
    var btn = document.getElementById("authBtn");
    msg.innerHTML = "";
    if(!email || !senha){ msg.innerHTML = '<div class="err">Preencha e-mail e senha.</div>'; return; }
    btn.disabled = true; btn.textContent = "Aguarde...";
    try{
      if(modoLogin){
        var r = await sb.auth.signInWithPassword({email:email, password:senha});
        if(r.error){
          msg.innerHTML = '<div class="err">' + (r.error.message === "Invalid login credentials" ? "E-mail ou senha incorretos." : "Erro: " + r.error.message) + '</div>';
        } else if(r.data && r.data.session){
          await mostrarApp(r.data.session.user);
        } else {
          msg.innerHTML = '<div class="err">Login falhou.</div>';
        }
      } else {
        var nome = document.getElementById("nomeInput").value.trim();
        if(!nome){ msg.innerHTML = '<div class="err">Informe seu nome.</div>'; return; }
        var r2 = await sb.auth.signUp({email:email, password:senha});
        if(r2.error){ msg.innerHTML = '<div class="err">' + r2.error.message + '</div>'; return; }
        if(r2.data && r2.data.user){
          await sb.from("perfis").update({nome:nome}).eq("id", r2.data.user.id);
          msg.innerHTML = '<div class="ok">Conta criada! Faça login.</div>';
          modoLogin = true;
          toggleAuthMode();
        }
      }
    } catch(e){
      msg.innerHTML = '<div class="err">Erro: ' + e.message + '</div>';
    } finally {
      btn.disabled = false;
      btn.textContent = modoLogin ? "Entrar" : "Cadastrar";
    }
  }

  document.getElementById("authBtn").addEventListener("click", handleAuth);
  document.getElementById("toggleBtn").addEventListener("click", toggleAuthMode);

  var usuario=null, equipamentos=[], categorias=[], filtroAtivo="Todas", editEqId=null, editCatId=null;

  function brl(v){return"R$ "+Number(v||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});}
  function esc(s){return(s||"").replace(/'/g,"\\'");}
  function showMsg(txt,erro){var el=document.getElementById("appMsg");el.innerHTML='<div class="'+(erro?"err":"ok")+'">'+txt+'</div>';setTimeout(function(){el.innerHTML="";},3000);}
  function abrirModal(id){var el=document.getElementById(id);if(el)el.style.display="flex";}
  function fecharModal(id){var el=document.getElementById(id);if(el)el.style.display="none";}
  function on(id,ev,fn){var el=document.getElementById(id);if(el)el.addEventListener(ev,fn);}
  document.querySelectorAll('.modal-bg').forEach(function(m){ m.style.display = 'none'; });

  document.querySelectorAll('[data-close]').forEach(function(btn){
    btn.addEventListener('click', function(){ fecharModal(btn.getAttribute('data-close')); });
  });
  function abrirConfirm(msg,onOk){
    document.getElementById("modalConfirmMsg").textContent=msg;
    document.getElementById("modalConfirmOk").onclick=function(){fecharModal("modalConfirm");onOk();};
    abrirModal("modalConfirm");
  }

  async function carregarEquipamentos(){var r=await sb.from("equipamentos").select("*").order("nome");equipamentos=r.data||[];}
  async function carregarCategorias(){var r=await sb.from("categorias").select("*").order("nome");categorias=r.data||[];renderCategorias();}

  function renderMetrics(){
    var total=equipamentos.reduce(function(a,e){return a+e.qtd_total;},0);
    var disp=equipamentos.reduce(function(a,e){return a+e.qtd_disponivel;},0);
    document.getElementById("metricsArea").innerHTML='<div class="metric"><div class="metric-label">Total</div><div class="metric-value">'+total+'</div></div><div class="metric"><div class="metric-label" style="color:#3b6d11">Disponíveis</div><div class="metric-value" style="color:#3b6d11">'+disp+'</div></div><div class="metric"><div class="metric-label" style="color:#854f0b">Alocados</div><div class="metric-value" style="color:#854f0b">'+(total-disp)+'</div></div>';
  }
  function renderEquipamentos(){
    var cats=["Todas"];
    equipamentos.forEach(function(e){if(cats.indexOf(e.categoria)===-1)cats.push(e.categoria);});
    document.getElementById("filtrosArea").innerHTML=cats.map(function(c){return '<button class="filter-btn'+(filtroAtivo===c?" active":"")+'" data-cat="'+c+'">'+c+'</button>';}).join("");
    document.querySelectorAll("#filtrosArea .filter-btn").forEach(function(b){b.addEventListener("click",function(){filtroAtivo=b.getAttribute("data-cat");renderEquipamentos();});});
    var busca=document.getElementById("buscaEq").value.toLowerCase();
    var lista=filtroAtivo==="Todas"?equipamentos:equipamentos.filter(function(e){return e.categoria===filtroAtivo;});
    if(busca)lista=lista.filter(function(e){return e.nome.toLowerCase().indexOf(busca)!==-1;});
    document.getElementById("listaEquipamentos").innerHTML=lista.map(function(eq){
      var aloc=eq.qtd_total-eq.qtd_disponivel,pct=Math.round((eq.qtd_disponivel/eq.qtd_total)*100);
      var cor=eq.qtd_disponivel===0?"#e24b4a":(aloc>0?"#EF9F27":"#639922");
      return '<div class="card"><div class="item-row"><div><div class="item-name">'+eq.nome+'</div><div class="item-sub">'+eq.categoria+' · Série: '+(eq.numero_serie||"—")+'</div></div><div class="actions"><span class="badge badge-ok">'+eq.qtd_disponivel+' disp.</span></div></div><div class="progress-wrap"><div class="progress-bar" style="width:'+pct+'%;background:'+cor+'"></div></div></div>';
    }).join("")||'<div class="empty">Nenhum equipamento.</div>';
  }
  function renderGerenciarEquipamentos(){
    document.getElementById("gerenciarEquipamentos").innerHTML=equipamentos.map(function(eq){
      return '<div class="card"><div class="item-row"><div><div class="item-name">'+eq.nome+'</div><div class="item-sub">'+eq.categoria+' · Qtd: '+eq.qtd_total+'</div></div><div class="actions"><button class="btn btn-sm btn-edit" style="width:auto" data-editeq="'+eq.id+'">Editar</button><button class="btn btn-sm btn-danger" style="width:auto" data-delEq="'+eq.id+'">Excluir</button></div></div></div>';
    }).join("")||'<div class="empty">Nenhum.</div>';
    document.querySelectorAll("[data-editeq]").forEach(function(b){b.addEventListener("click",function(){abrirEditarEq(parseInt(b.getAttribute("data-editeq")));});});
    document.querySelectorAll("[data-delEq]").forEach(function(b){b.addEventListener("click",function(){
      var id=parseInt(b.getAttribute("data-delEq"));
      var eq=equipamentos.find(function(e){return e.id===id;});
      abrirConfirm('Excluir "'+esc(eq.nome)+'"?',function(){excluirEq(id);});
    });});
  }
  function renderCategorias(){
    document.getElementById("eqCat").innerHTML=categorias.map(function(c){return '<option value="'+c.nome+'">'+c.nome+'</option>';}).join("");
    document.getElementById("editEqCat").innerHTML=categorias.map(function(c){return '<option value="'+c.nome+'">'+c.nome+'</option>';}).join("");
    document.getElementById("listaCategorias").innerHTML=categorias.map(function(c){
      return '<div class="tag-item">'+c.nome+'<button class="tag-x" data-editcat="'+c.id+'" style="color:#185fa5">✏</button><button class="tag-x" data-delcat="'+c.id+'">×</button></div>';
    }).join("")||"<span style='color:#888;font-size:13px'>Nenhuma.</span>";
    document.querySelectorAll("[data-editcat]").forEach(function(b){b.addEventListener("click",function(){
      var id=parseInt(b.getAttribute("data-editcat"));
      var c=categorias.find(function(x){return x.id===id;});
      editCatId=id;document.getElementById("editCatNome").value=c.nome;abrirModal("modalCat");
    });});
    document.querySelectorAll("[data-delcat]").forEach(function(b){b.addEventListener("click",function(){
      var id=parseInt(b.getAttribute("data-delcat"));
      var c=categorias.find(function(x){return x.id===id;});
      if(equipamentos.some(function(e){return e.categoria===c.nome;})){showMsg('"'+c.nome+'" está em uso.',true);return;}
      abrirConfirm('Excluir a categoria "'+esc(c.nome)+'"?',async function(){
        await sb.from("categorias").delete().eq("id",id);await carregarCategorias();showMsg("Categoria excluída.");
      });
    });});
  }
  function abrirEditarEq(id){
    var eq=equipamentos.find(function(e){return e.id===id;});
    editEqId=id;
    document.getElementById("editEqNome").value=eq.nome;
    document.getElementById("editEqCat").value=eq.categoria;
    document.getElementById("editEqQtd").value=eq.qtd_total;
    document.getElementById("editEqSerie").value=eq.numero_serie||"";
    abrirModal("modalEq");
  }
  async function excluirEq(id){
    var mr=await sb.from("movimentacoes").select("id").eq("equipamento_id",id).limit(1);
    if(mr.data&&mr.data.length>0)await sb.from("movimentacoes").delete().eq("equipamento_id",id);
    await sb.from("equipamentos").delete().eq("id",id);
    await carregarEquipamentos();renderMetrics();renderEquipamentos();renderGerenciarEquipamentos();
    showMsg("Equipamento excluído.");
  }

  document.getElementById("buscaEq").addEventListener("input",renderEquipamentos);
  document.getElementById("btnCadastrarEq").addEventListener("click", async function(){
    var nome=document.getElementById("eqNome").value.trim();
    var cat=document.getElementById("eqCat").value;
    var qtd=parseInt(document.getElementById("eqQtd").value);
    var serie=document.getElementById("eqSerie").value.trim();
    if(!nome)return;
    var r=await sb.from("equipamentos").insert({nome:nome,categoria:cat,qtd_total:qtd,qtd_disponivel:qtd,numero_serie:serie||null});
    if(r.error){showMsg("Erro: "+r.error.message,true);return;}
    document.getElementById("eqNome").value="";document.getElementById("eqSerie").value="";document.getElementById("eqQtd").value=1;
    await carregarEquipamentos();renderMetrics();renderEquipamentos();renderGerenciarEquipamentos();
    showMsg("Equipamento adicionado!");
  });
  document.getElementById("btnSalvarEq").addEventListener("click", async function(){
    var nome=document.getElementById("editEqNome").value.trim();
    var categoria=document.getElementById("editEqCat").value;
    var qtd_total=parseInt(document.getElementById("editEqQtd").value);
    var numero_serie=document.getElementById("editEqSerie").value.trim()||null;
    var eq=equipamentos.find(function(e){return e.id===editEqId;});
    var qtd_disponivel=Math.max(0,eq.qtd_disponivel+(qtd_total-eq.qtd_total));
    await sb.from("equipamentos").update({nome:nome,categoria:categoria,qtd_total:qtd_total,qtd_disponivel:qtd_disponivel,numero_serie:numero_serie}).eq("id",editEqId);
    fecharModal("modalEq");
    await carregarEquipamentos();renderMetrics();renderEquipamentos();renderGerenciarEquipamentos();
    showMsg("Equipamento atualizado!");
  });
  document.getElementById("btnCriarCategoria").addEventListener("click", async function(){
    var nome=document.getElementById("catNome").value.trim();if(!nome)return;
    var r=await sb.from("categorias").insert({nome:nome});
    if(r.error){showMsg("Categoria já existe.",true);return;}
    document.getElementById("catNome").value="";
    await carregarCategorias();showMsg("Categoria adicionada!");
  });
  document.getElementById("btnSalvarCategoria").addEventListener("click", async function(){
    var nome=document.getElementById("editCatNome").value.trim();if(!nome)return;
    await sb.from("categorias").update({nome:nome}).eq("id",editCatId);
    fecharModal("modalCat");await carregarCategorias();showMsg("Categoria atualizada!");
  });

  document.getElementById("btnSair").addEventListener("click", async function(){await sb.auth.signOut();location.reload();});

  var projetos=[], freelancers=[];

  document.querySelectorAll(".tab").forEach(function(t){
    t.addEventListener("click", function(){
      document.querySelectorAll(".tab").forEach(function(x){x.classList.remove("active");});
      t.classList.add("active");
      var nome=t.getAttribute("data-tab");
      ["estoque","projetos","freelancers","movimentar","historico","calendario","orcamentos","financas","usuarios"].forEach(function(n){
        var d=document.getElementById("tab-"+n);
        if(d)d.style.display=(n===nome)?"block":"none";
      });
      if(nome==="historico")renderHistorico();
      if(nome==="movimentar")preencherSelectsMov();
      if(nome==="calendario")renderCalendario();
      if(nome==="orcamentos")renderOrcamentos();
      if(nome==="financas")renderFinancas();
      if(nome==="usuarios")renderUsuarios();
    });
  });

  async function carregarProjetos(){var r=await sb.from("projetos").select("*").order("id");projetos=r.data||[];}
  async function carregarFreelancers(){var r=await sb.from("freelancers").select("*").order("nome");freelancers=r.data||[];}

  function renderProjetos(){
    document.getElementById("listaProjetos").innerHTML=projetos.map(function(p){
      var dt=p.data_projeto?new Date(p.data_projeto+"T12:00:00").toLocaleDateString("pt-BR"):"—";
      return '<div class="card"><div class="item-row"><div><div class="item-name">'+p.nome+'</div><div class="item-sub">Cliente: '+(p.cliente||"—")+' · '+dt+'</div></div><div class="actions"><span class="badge '+(p.status==="ativo"?"badge-ok":"")+'">'+p.status+'</span><button class="btn btn-sm btn-danger" style="width:auto" data-delProj="'+p.id+'">Excluir</button></div></div></div>';
    }).join("")||'<div class="empty">Nenhum projeto.</div>';
    document.querySelectorAll("[data-delProj]").forEach(function(b){b.addEventListener("click",function(){
      var id=parseInt(b.getAttribute("data-delProj"));
      var p=projetos.find(function(x){return x.id===id;});
      abrirConfirm('Excluir "'+esc(p.nome)+'"?',async function(){
        await sb.from("projetos").delete().eq("id",id);await carregarProjetos();renderProjetos();showMsg("Projeto excluído.");
      });
    });});
  }
  function renderFreelancers(){
    document.getElementById("listaFreelancers").innerHTML=freelancers.map(function(f){
      return '<div class="card"><div class="item-row"><div><div class="item-name">'+f.nome+'</div><div class="item-sub">'+(f.funcao||"—")+' · Tel: '+(f.telefone||"—")+'</div></div><button class="btn btn-sm btn-danger" style="width:auto" data-delFl="'+f.id+'">Excluir</button></div></div>';
    }).join("")||'<div class="empty">Nenhum freelancer.</div>';
    document.querySelectorAll("[data-delFl]").forEach(function(b){b.addEventListener("click",function(){
      var id=parseInt(b.getAttribute("data-delFl"));
      var f=freelancers.find(function(x){return x.id===id;});
      abrirConfirm('Excluir "'+esc(f.nome)+'"?',async function(){
        await sb.from("freelancers").delete().eq("id",id);await carregarFreelancers();renderFreelancers();showMsg("Freelancer excluído.");
      });
    });});
  }

  document.getElementById("btnCriarProjeto").addEventListener("click", async function(){
    var nome=document.getElementById("projNome").value.trim();
    var cliente=document.getElementById("projCliente").value.trim();
    var data=document.getElementById("projData").value||null;
    if(!nome)return;
    var r=await sb.from("projetos").insert({nome:nome,cliente:cliente||null,data_projeto:data});
    if(r.error){showMsg("Erro: "+r.error.message,true);return;}
    document.getElementById("projNome").value="";document.getElementById("projCliente").value="";
    await carregarProjetos();renderProjetos();showMsg("Projeto criado!");
  });
  document.getElementById("btnCadastrarFl").addEventListener("click", async function(){
    var nome=document.getElementById("flNome").value.trim();
    var tel=document.getElementById("flTel").value.trim();
    var funcao=document.getElementById("flFuncao").value.trim();
    if(!nome)return;
    var r=await sb.from("freelancers").insert({nome:nome,telefone:tel||null,funcao:funcao||null});
    if(r.error){showMsg("Erro: "+r.error.message,true);return;}
    document.getElementById("flNome").value="";document.getElementById("flTel").value="";document.getElementById("flFuncao").value="";
    await carregarFreelancers();renderFreelancers();showMsg("Freelancer cadastrado!");
  });

  async function carregarTudo(){
    await Promise.all([carregarEquipamentos(),carregarCategorias(),carregarProjetos(),carregarFreelancers(),carregarMovs(),carregarEventos(),carregarOrcamentos(),carregarPagFl(),carregarReceitas()]);
    renderMetrics();renderEquipamentos();renderGerenciarEquipamentos();renderProjetos();renderFreelancers();
  }

  // ── CALENDÁRIO ──
  var calEventos=[], calAno=new Date().getFullYear(), calMes=new Date().getMonth();
  var MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  async function carregarEventos(){var r=await sb.from("calendario_eventos").select("*").order("data");calEventos=r.data||[];}
  function renderCalendario(){
    var tEl=document.getElementById("calTitulo");if(!tEl)return;
    tEl.textContent=MESES[calMes]+" "+calAno;
    var primeiroDia=new Date(calAno,calMes,1).getDay(),diasNoMes=new Date(calAno,calMes+1,0).getDate();
    var html="";
    for(var i=0;i<primeiroDia;i++)html+='<div></div>';
    for(var d=1;d<=diasNoMes;d++){
      var ds=calAno+"-"+String(calMes+1).padStart(2,'0')+"-"+String(d).padStart(2,'0');
      var evsD=calEventos.filter(function(e){return e.data===ds;});
      html+='<div style="border:0.5px solid #e0e0d8;border-radius:6px;padding:4px;min-height:50px;font-size:11px"><div>'+d+'</div>'+evsD.map(function(e){return '<div style="background:#eaf3de;border-radius:3px;padding:1px 3px;margin-top:2px;font-size:9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+e.titulo+'</div>';}).join("")+'</div>';
    }
    document.getElementById("calGrid").innerHTML=html;
    var evsMes=calEventos.filter(function(e){var dt=new Date(e.data+"T12:00:00");return dt.getMonth()===calMes&&dt.getFullYear()===calAno;});
    document.getElementById("listaEventos").innerHTML=evsMes.map(function(e){
      var dt=new Date(e.data+"T12:00:00").toLocaleDateString("pt-BR");
      return '<div class="card"><div class="item-row"><div><div class="item-name">'+e.titulo+'</div><div class="item-sub">'+dt+'</div></div><button class="btn btn-sm btn-danger" style="width:auto" data-delEv="'+e.id+'">Excluir</button></div></div>';
    }).join("")||'<div class="empty">Nenhum evento neste mês.</div>';
    document.querySelectorAll("[data-delEv]").forEach(function(b){b.addEventListener("click",async function(){
      await sb.from("calendario_eventos").delete().eq("id",parseInt(b.getAttribute("data-delEv")));
      await carregarEventos();renderCalendario();showMsg("Evento excluído.");
    });});
  }
  on("btnMesAnt","click",function(){calMes--;if(calMes<0){calMes=11;calAno--;}renderCalendario();});
  on("btnMesProx","click",function(){calMes++;if(calMes>11){calMes=0;calAno++;}renderCalendario();});
  on("btnCriarEvento","click",async function(){
    var titulo=document.getElementById("evTitulo").value.trim();
    var data=document.getElementById("evData").value;
    if(!titulo||!data){showMsg("Preencha título e data.",true);return;}
    await sb.from("calendario_eventos").insert({titulo:titulo,data:data});
    document.getElementById("evTitulo").value="";document.getElementById("evData").value="";
    await carregarEventos();renderCalendario();showMsg("Evento criado!");
  });

  // ── ORÇAMENTOS ──
  var orcamentos=[];
  async function carregarOrcamentos(){var r=await sb.from("orcamentos").select("*");orcamentos=r.data||[];}
  function renderOrcamentos(){
    var el=document.getElementById("listaOrcamentos");if(!el)return;
    el.innerHTML=orcamentos.map(function(o){
      var margem=o.margem||0,valor=Number(o.valor||0),total=valor*(1+margem/100);
      return '<div class="card"><div class="item-row"><div><div class="item-name">'+o.titulo+'</div><div class="item-sub">Cliente: '+(o.cliente||"—")+' · +'+margem+'%</div></div><div class="actions"><strong>'+brl(total)+'</strong><button class="btn btn-sm btn-danger" style="width:auto" data-delOrc="'+o.id+'">Excluir</button></div></div></div>';
    }).join("")||'<div class="empty">Nenhum orçamento.</div>';
    document.querySelectorAll("[data-delOrc]").forEach(function(b){b.addEventListener("click",async function(){
      await sb.from("orcamentos").delete().eq("id",parseInt(b.getAttribute("data-delOrc")));
      await carregarOrcamentos();renderOrcamentos();showMsg("Orçamento excluído.");
    });});
  }
  on("btnCriarOrc","click",async function(){
    var titulo=document.getElementById("orcTitulo").value.trim();
    var cliente=document.getElementById("orcCliente").value.trim();
    var valor=parseFloat(document.getElementById("orcValor").value)||0;
    var margem=parseFloat(document.getElementById("orcMargem").value)||0;
    if(!titulo||!valor){showMsg("Preencha título e valor.",true);return;}
    await sb.from("orcamentos").insert({titulo:titulo,cliente:cliente||null,valor:valor,margem:margem,criado_por:usuario.id});
    document.getElementById("orcTitulo").value="";document.getElementById("orcCliente").value="";document.getElementById("orcValor").value="";document.getElementById("orcMargem").value=0;
    await carregarOrcamentos();renderOrcamentos();showMsg("Orçamento criado!");
  });

  // ── FINANÇAS ──
  var pagamentosFl=[], receitasList=[];
  async function carregarPagFl(){var r=await sb.from("pagamentos_freelancer").select("*");pagamentosFl=r.data||[];}
  async function carregarReceitas(){var r=await sb.from("receitas").select("*");receitasList=r.data||[];}
  function renderFinancas(){
    var pagSel=document.getElementById("pagFlSel");
    if(pagSel)pagSel.innerHTML=freelancers.map(function(f){return '<option value="'+f.id+'">'+f.nome+'</option>';}).join("");
    var totRec=receitasList.reduce(function(s,r){return s+Number(r.valor);},0);
    var totPag=pagamentosFl.reduce(function(s,p){return s+Number(p.valor);},0);
    document.getElementById("finCards").innerHTML='<div class="metric"><div class="metric-label" style="color:#3b6d11">Recebido</div><div class="metric-value" style="color:#3b6d11">'+brl(totRec)+'</div></div><div class="metric"><div class="metric-label" style="color:#854f0b">Pago</div><div class="metric-value" style="color:#854f0b">'+brl(totPag)+'</div></div><div class="metric"><div class="metric-label">Saldo</div><div class="metric-value">'+brl(totRec-totPag)+'</div></div>';
    document.getElementById("listaPagFl").innerHTML=pagamentosFl.map(function(p){
      var f=freelancers.find(function(x){return x.id===p.freelancer_id;});
      return '<div class="card"><div class="item-row"><div>'+(f?f.nome:"—")+'</div><div class="actions"><strong>'+brl(p.valor)+'</strong><button class="btn btn-sm btn-danger" style="width:auto" data-delPag="'+p.id+'">×</button></div></div></div>';
    }).join("")||'<div class="empty">Nenhum pagamento.</div>';
    document.getElementById("listaReceitas").innerHTML=receitasList.map(function(r){
      return '<div class="card"><div class="item-row"><div>'+r.descricao+'</div><div class="actions"><strong style="color:#3b6d11">'+brl(r.valor)+'</strong><button class="btn btn-sm btn-danger" style="width:auto" data-delRec="'+r.id+'">×</button></div></div></div>';
    }).join("")||'<div class="empty">Nenhuma receita.</div>';
    document.querySelectorAll("[data-delPag]").forEach(function(b){b.addEventListener("click",async function(){await sb.from("pagamentos_freelancer").delete().eq("id",parseInt(b.getAttribute("data-delPag")));await carregarPagFl();renderFinancas();});});
    document.querySelectorAll("[data-delRec]").forEach(function(b){b.addEventListener("click",async function(){await sb.from("receitas").delete().eq("id",parseInt(b.getAttribute("data-delRec")));await carregarReceitas();renderFinancas();});});
  }
  on("btnNovoPagto","click",async function(){
    var flId=parseInt(document.getElementById("pagFlSel").value);
    var valor=parseFloat(document.getElementById("pagFlValor").value)||0;
    if(!flId||!valor){showMsg("Preencha os campos.",true);return;}
    await sb.from("pagamentos_freelancer").insert({freelancer_id:flId,valor:valor,status:"pendente"});
    document.getElementById("pagFlValor").value="";
    await carregarPagFl();renderFinancas();showMsg("Pagamento registrado!");
  });
  on("btnNovaReceita","click",async function(){
    var desc=document.getElementById("receitaDesc").value.trim();
    var valor=parseFloat(document.getElementById("receitaValor").value)||0;
    if(!desc||!valor){showMsg("Preencha os campos.",true);return;}
    await sb.from("receitas").insert({descricao:desc,valor:valor,status:"recebida"});
    document.getElementById("receitaDesc").value="";document.getElementById("receitaValor").value="";
    await carregarReceitas();renderFinancas();showMsg("Receita registrada!");
  });

  // ── USUÁRIOS ──
  function renderUsuarios(){
    sb.from("perfis").select("*").then(function(r){
      var data=r.data||[];
      document.getElementById("listaUsuarios").innerHTML=data.map(function(u){
        return '<div class="card"><div class="item-row"><div>'+u.nome+'</div><span class="badge badge-ok">'+(u.papel||"usuario")+'</span></div></div>';
      }).join("")||'<div class="empty">Nenhum usuário.</div>';
    });
  }

  var todasMovs=[];
  async function carregarMovs(){var r=await sb.from("movimentacoes").select("*,equipamentos(nome),projetos(nome)").order("criado_em",{ascending:false}).limit(200);todasMovs=r.data||[];}

  function preencherSelectsMov(){
    var movProjEl=document.getElementById("movProj"),devProjEl=document.getElementById("devProj"),movEqEl=document.getElementById("movEq"),movDataEl=document.getElementById("movData");
    if(!movProjEl||!devProjEl||!movEqEl)return;
    var opts=projetos.filter(function(p){return p.status==="ativo";}).map(function(p){return '<option value="'+p.id+'">'+p.nome+'</option>';}).join("");
    movProjEl.innerHTML='<option value="">Selecione...</option>'+opts;
    devProjEl.innerHTML='<option value="">Selecione...</option>'+opts;
    movEqEl.innerHTML='<option value="">Selecione...</option>'+equipamentos.map(function(e){return '<option value="'+e.id+'">'+e.nome+' ('+e.qtd_disponivel+' disp.)</option>';}).join("");
    if(movDataEl)movDataEl.value=new Date().toISOString().split("T")[0];
  }

  function renderHistorico(){
    var el=document.getElementById("listaHistorico");
    if(!el)return;
    el.innerHTML=todasMovs.map(function(m){
      return '<div class="card" style="margin-bottom:8px"><div class="item-name" style="font-size:14px">'+(m.equipamentos?m.equipamentos.nome:"—")+'</div><div class="item-sub">'+(m.projetos?m.projetos.nome:"—")+' · '+m.responsavel+' · '+m.data+' · '+m.tipo+' · ×'+m.quantidade+'</div></div>';
    }).join("")||'<div class="empty">Nenhuma movimentação.</div>';
  }

  on("btnRegistrarSaida","click", async function(){
    var projId=parseInt(document.getElementById("movProj").value);
    var eqId=parseInt(document.getElementById("movEq").value);
    var qtd=parseInt(document.getElementById("movQtd").value);
    var resp=document.getElementById("movResp").value.trim();
    var data=document.getElementById("movData").value;
    if(!projId||!eqId||!resp){showMsg("Preencha todos os campos.",true);return;}
    var eq=equipamentos.find(function(e){return e.id===eqId;});
    if(eq.qtd_disponivel<qtd){showMsg("Quantidade insuficiente.",true);return;}
    await sb.from("movimentacoes").insert({tipo:"saída",equipamento_id:eqId,projeto_id:projId,quantidade:qtd,responsavel:resp,data:data,criado_por:usuario.id});
    await sb.from("equipamentos").update({qtd_disponivel:eq.qtd_disponivel-qtd}).eq("id",eqId);
    await carregarEquipamentos();await carregarMovs();renderMetrics();renderEquipamentos();renderGerenciarEquipamentos();preencherSelectsMov();
    document.getElementById("movResp").value="";
    showMsg("Saída registrada!");
  });

  async function carregarEqProjeto(){
    var projId=parseInt(document.getElementById("devProj").value);
    var lista=document.getElementById("devLista");
    if(!projId){lista.innerHTML="";return;}
    var r=await sb.from("movimentacoes").select("equipamento_id,quantidade,tipo").eq("projeto_id",projId);
    var movs=r.data||[];
    var alocMap={};
    movs.forEach(function(m){if(!alocMap[m.equipamento_id])alocMap[m.equipamento_id]=0;alocMap[m.equipamento_id]+=(m.tipo==="saída"?m.quantidade:-m.quantidade);});
    var eqsAloc=Object.keys(alocMap).map(function(id){return{eq:equipamentos.find(function(e){return e.id===parseInt(id);}),alocado:alocMap[id]};}).filter(function(x){return x.alocado>0&&x.eq;});
    if(!eqsAloc.length){lista.innerHTML='<div class="empty">Nenhum equipamento alocado.</div>';return;}
    lista.innerHTML=eqsAloc.map(function(x){return '<div class="item-row" style="padding:6px 0;border-bottom:0.5px solid #f1efe8"><span>'+x.eq.nome+'</span><span class="badge badge-warn">× '+x.alocado+'</span></div>';}).join("");
  }
  on("devProj","change",carregarEqProjeto);

  on("btnDevolver","click", async function(){
    var projId=parseInt(document.getElementById("devProj").value);
    if(!projId){showMsg("Selecione um projeto.",true);return;}
    var r=await sb.from("movimentacoes").select("equipamento_id,quantidade,tipo").eq("projeto_id",projId);
    var movs=r.data||[];
    var alocMap={};
    movs.forEach(function(m){if(!alocMap[m.equipamento_id])alocMap[m.equipamento_id]=0;alocMap[m.equipamento_id]+=(m.tipo==="saída"?m.quantidade:-m.quantidade);});
    var ids=Object.keys(alocMap).filter(function(id){return alocMap[id]>0;});
    for(var i=0;i<ids.length;i++){
      var eqId=parseInt(ids[i]),qtd=alocMap[ids[i]];
      var eq=equipamentos.find(function(e){return e.id===eqId;});
      await sb.from("movimentacoes").insert({tipo:"entrada",equipamento_id:eqId,projeto_id:projId,quantidade:qtd,responsavel:"Sistema",data:new Date().toISOString().split("T")[0],criado_por:usuario.id});
      await sb.from("equipamentos").update({qtd_disponivel:Math.min(eq.qtd_total,eq.qtd_disponivel+qtd)}).eq("id",eqId);
    }
    await carregarEquipamentos();await carregarMovs();renderMetrics();renderEquipamentos();renderGerenciarEquipamentos();preencherSelectsMov();
    document.getElementById("devLista").innerHTML="";
    showMsg("Devolução registrada!");
  });

  async function mostrarApp(user){
    usuario=user;
    document.getElementById("authScreen").style.display="none";
    document.getElementById("appScreen").style.display="block";
    document.getElementById("userNome").textContent=user.email;
    await carregarTudo();
  }

  window.addEventListener("load", async function(){
    var r = await sb.auth.getSession();
    if(r.data && r.data.session && r.data.session.user){
      await mostrarApp(r.data.session.user);
    }
  });

}catch(_topErr){
  var _d = document.createElement('div');
  _d.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#a32d2d;color:#fff;padding:16px;z-index:99999;font-family:monospace;font-size:13px;white-space:pre-wrap;';
  _d.textContent = 'ERRO NA INICIALIZAÇÃO:\n' + _topErr.message;
  document.body.appendChild(_d);
}
</script>
</body>
</html>
